<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rankdle - who's the better person?</title>
    <meta name="description" content="Two historical people at a time. Pick the better one and the other gets replaced with someone new.">
    <meta name="theme-color" content="#0b0b0b">

    <meta property="og:title" content="Rankdle">
    <meta property="og:description" content="Two people. Pick the better one. The loser gets replaced with someone new.">
    <meta property="og:type" content="website">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230b0b0b'/%3E%3Ctext x='32' y='46' font-family='Arial' font-size='40' font-weight='800' fill='%23fff' text-anchor='middle'%3E%3F%3C/text%3E%3C/svg%3E">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="navbar">
        <div class="logo">
            RANKDLE
        </div>

        <div class="date" id="today-date">
            &nbsp;
        </div>
    </header>


    <!-- Main Content -->
    <main class="main-container">

        <!-- Title -->
        <section class="hero">
            <h1>Who&rsquo;s better?</h1>

            <p>
                Two people. Pick the better one &mdash; the other gets replaced with someone new.
            </p>
        </section>


        <!-- Scoreboard -->
        <section class="stats" aria-live="polite">
            <div class="stat">
                <span class="stat-value" id="stat-rounds">0</span>
                <span class="stat-label">PICKS</span>
            </div>

            <div class="stat">
                <span class="stat-value" id="stat-agree">&mdash;</span>
                <span class="stat-label">AGREED WITH THE COMMUNITY</span>
            </div>
        </section>


        <!-- The two people (rendered by script.js) -->
        <section class="duel-section">

            <div class="people-container" id="people-container"></div>

            <p class="hint">
                Tap a card to pick. Nobody comes back twice in a session.
            </p>

        </section>

    </main>


    <!-- Footer -->
    <footer>
        <p>Two at a time, all day.</p>
        <p class="footer-links">
            Portraits from
            <a href="images/CREDITS.md">Wikipedia</a>
            &middot;
            <a href="?reset=1">reset session</a>
        </p>
    </footer>


    <script src="people.js"></script>
    <script src="script.js"></script>

</body>
</html>
