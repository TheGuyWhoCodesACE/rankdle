<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Rankdle - who's the better person?</title>
    <meta name="description" content="Two people at a time - historical figures, musicians, streamers, creators and fictional characters. Pick the better one and the other gets replaced with someone new.">
    <meta name="theme-color" content="#0a0a0c">

    <meta property="og:title" content="Rankdle">
    <meta property="og:description" content="Two people. Pick the better one. The loser gets replaced with someone new.">
    <meta property="og:type" content="website">

    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23f2b544'/%3E%3Ctext x='32' y='46' font-family='Arial' font-size='40' font-weight='800' fill='%23171204' text-anchor='middle'%3E%3F%3C/text%3E%3C/svg%3E">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Instrument+Serif:ital@0;1&display=swap">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header class="navbar">
        <div class="logo">
            <span class="logo-mark" aria-hidden="true">?</span>
            <span class="logo-text">RANKDLE</span>
        </div>

        <div class="date">
            <span id="today-date">&nbsp;</span>
        </div>
    </header>


    <!-- Main Content -->
    <main class="main-container">

        <!-- Title -->
        <section class="hero">
            <span class="hero-kicker">Head-to-head</span>

            <h1>Who&rsquo;s <em class="accent-word">better?<svg class="squiggle" viewBox="0 0 200 12" aria-hidden="true"><path pathLength="1" d="M3 8.4C28 3.2 52 10.4 79 7.2 104 4.3 128 10.4 152 6.8 168 4.5 184 7.6 197 5.6"/></svg></em></h1>

            <p class="hero-sub">
                Two people. Pick the better one &mdash; the other gets replaced with someone new.
            </p>
        </section>


        <!-- The two people (rendered by script.js) -->
        <section class="duel-section">

            <div class="section-head">
                <span class="section-label">Make your pick</span>
                <span class="rule" aria-hidden="true"></span>
            </div>

            <div class="duel-frame">
                <div class="people-container" id="people-container"></div>
                <span class="vs-badge" aria-hidden="true">VS</span>
            </div>

            <p class="hint">
                Tap a card to choose &mdash; or focus one and press
                <kbd>Enter</kbd>.
            </p>

        </section>

    </main>


    <!-- Footer -->
    <footer>
        <p class="footer-tagline">Two at a time, all day.</p>
        <p class="footer-links">
            Portraits from
            <a href="images/CREDITS.md">Wikipedia</a>
            &middot;
            <a href="?reset=1">reset session</a>
        </p>
    </footer>


    <script src="people.js"></script>
    <script src="script.js"></script>

</body>
</html>
